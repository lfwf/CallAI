<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CALL//AI — AI 创作活动索引</title>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="#top" aria-label="CALL AI 首页"><b>CALL</b><i>//</i><b>AI</b></a>
      <label class="top-search">
        <span>搜索活动</span>
        <input id="searchInput" type="search" placeholder="搜索活动或主办方" autocomplete="off" />
      </label>
      <a class="submit-mini" href="https://github.com/lfwf/CallAI/issues/new" target="_blank" rel="noreferrer">提交活动 ↗</a>
    </header>

    <main id="top">
      <section class="index-section" id="index">
        <div class="view-switch" role="tablist" aria-label="活动视图">
          <button class="view-tab active" data-view="all" role="tab">全部分类</button>
          <button class="view-tab" data-view="urgent" role="tab">即将截止</button>
          <button class="view-tab" data-view="closed" role="tab">已过期</button>
        </div>

        <div class="secondary-tools">
          <label>参与方式<select id="modeSelect"><option value="">全部</option><option value="online">线上</option><option value="offline">线下</option><option value="hybrid">混合</option></select></label>
          <label>地区<select id="regionSelect"><option value="">全部地区</option><option value="全球">全球</option><option value="中国大陆">中国大陆</option></select></label>
          <label class="sort-control">排序<select id="sortSelect"><option value="deadline">最早截止</option><option value="newest">最新收录</option><option value="reward">奖励优先</option></select></label>
          <button class="clear-filters" id="clearFilters">清除筛选 ×</button>
        </div>

        <div class="event-list" id="eventList" aria-live="polite" aria-busy="true"></div>
        <div class="empty-state" id="emptyState" hidden><b>∅</b><span>没有匹配的活动。试试清除筛选。</span></div>
        <div class="load-error" id="loadError" hidden role="alert"><b>加载失败</b><p>暂时无法读取活动数据。</p><button id="retryLoad">重新加载</button></div>
      </section>
    </main>

    <footer><a class="wordmark" href="#top"><b>CALL</b><i>//</i><b>AI</b></a><p>活动信息以官方页面为准</p><p>© 2026</p></footer>
  </body>
</html>
